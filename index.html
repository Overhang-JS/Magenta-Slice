<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>均等分割チャレンジ</title>
<style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#e9f1fb;background:#101827}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:650px;margin:auto}h1{font-size:1.5rem;margin:4px 0}p{color:#aabbd0;font-size:.9rem;line-height:1.6}.panel{background:#192539;border:1px solid #34465f;border-radius:16px;padding:15px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:.82rem;color:#c7d5e7;display:block;margin-bottom:5px}select,input,button{width:100%;background:#263850;border:1px solid #4a6484;border-radius:10px;color:white;padding:11px;font-size:1rem}button{cursor:pointer;font-weight:650}button.primary{background:#3877c5;border-color:#5597eb}button:disabled{opacity:.4}.board-wrap{position:relative;width:100%;aspect-ratio:1;background:#101827;border-radius:12px;overflow:hidden}#static-board{position:absolute;inset:0;width:100%;height:100%;display:block}canvas{position:absolute;inset:0;width:100%;height:auto;aspect-ratio:1;display:block;background:#101827;border-radius:12px;touch-action:none}#status{font-size:.85rem;text-align:center;color:#b9c8db;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.score{font-size:2.4rem;font-weight:800;color:#8dd8b1}.muted{color:#aabbd0;font-size:.85rem}.bar{display:flex;height:19px;overflow:hidden;border-radius:6px;margin:12px 0}.bar span{min-width:0}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.84rem}.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px}#results{display:none}#warning{color:#ffd29a;font-size:.84rem;margin-top:8px}.footer{font-size:.77rem;color:#8799b2}
</style></head><body><main><h1>◯ 均等分割チャレンジ v1.2</h1><p>線を何本でも描いて、図形をできるだけ均等な面積に分けましょう。</p><section class="panel"><div class="controls"><div><label for="shape">図形</label><select id="shape"><option value="circle">円</option><option value="half">半円</option><option value="quarter">1/4円</option></select></div><div><label for="target">目標分割数</label><input id="target" type="number" min="2" max="100" step="1" value="4" inputmode="numeric"></div><div><label for="mode">描画モード</label><select id="mode"><option value="free">自由曲線</option><option value="line">直線</option></select></div><div><label for="width">切断判定幅</label><select id="width"><option value="2">標準</option><option value="1">細い</option><option value="3">太い</option></select></div></div></section><section class="panel"><div class="board-wrap"><svg id="static-board" viewBox="0 0 480 480" aria-label="円のプレビュー"><circle cx="240" cy="240" r="194" fill="#dceaf5" stroke="#6786a7" stroke-width="3"/></svg><canvas id="board" width="480" height="480" aria-label="切断線を描く領域" style="background:transparent"></canvas></div><div id="status">図形の端から端まで線を引いてください</div><noscript><p style="color:#ffd29a">JavaScriptが無効です。iPhoneの「ファイル」アプリのプレビューでは採点できません。Webサイトとして公開したURLをSafariで開いてください。</p></noscript></section><div class="actions"><button id="undo">↶ 戻す</button><button id="reset">リセット</button><button class="primary" id="grade">採点する</button></div><section class="panel" id="results"><div class="muted">均等度スコア</div><div class="score" id="score">--</div><div id="summary"></div><div class="bar" id="bar"></div><div class="legend" id="legend"></div><div id="warning"></div></section><p class="footer">採点は480×480画素の近似面積に基づきます。切断線は幅のない境界として扱い、判定のため一時的に数画素の幅を持たせています。線が外周に達しない場合、領域は分割されません。</p></main>
<script>
(()=>{'use strict';
const N=480,c=document.querySelector('#board'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),palette=['#68b5e7','#e7b35f','#8dd3a7','#df8e9f','#b9a1ef','#e8d478','#74c6c1','#ef9c74','#a6c6f0','#c3dc85','#dbb6d6','#c7ad90'];let strokes=[],active=null,analysis=null; if(!ctx){document.getElementById('status').textContent='この表示環境ではCanvasを利用できません。SafariでHTMLを開いてください。';return;}

function inside(x,y){const dx=x-240,dy=y-240,r2=dx*dx+dy*dy;if(r2>194*194)return false;const s=$('shape').value;return s==='circle'||(s==='half'&&dy<=0)||(s==='quarter'&&dx>=0&&dy<=0)}
function outline(g){g.beginPath();const s=$('shape').value;if(s==='circle')g.arc(240,240,194,0,Math.PI*2);else if(s==='half'){g.arc(240,240,194,Math.PI,0);g.closePath()}else{g.moveTo(240,240);g.lineTo(434,240);g.arc(240,240,194,0,-Math.PI/2,true);g.closePath()}}
function path(g,points){if(points.length<2)return;g.beginPath();g.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)g.lineTo(points[i].x,points[i].y);g.stroke()}
function draw(){document.getElementById('static-board').style.display='none';ctx.clearRect(0,0,N,N);outline(ctx);ctx.fillStyle='#dceaf5';ctx.fill();ctx.save();outline(ctx);ctx.clip();if(analysis){const data=ctx.createImageData(N,N);for(let i=0;i<analysis.labels.length;i++){const label=analysis.labels[i];if(label<0)continue;const col=hexRgb(palette[label%palette.length]);const j=i*4;data.data[j]=col[0];data.data[j+1]=col[1];data.data[j+2]=col[2];data.data[j+3]=255}const colorCanvas=document.createElement('canvas');colorCanvas.width=colorCanvas.height=N;const colorCtx=colorCanvas.getContext('2d');colorCtx.putImageData(data,0,0);ctx.drawImage(colorCanvas,0,0);outline(ctx);ctx.clip()}ctx.strokeStyle='#ef725a';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';for(const s of strokes)path(ctx,s);if(active)path(ctx,active);ctx.restore();outline(ctx);ctx.lineWidth=3;ctx.strokeStyle='#6786a7';ctx.stroke()}
function hexRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function pos(e){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(N,(e.clientX-r.left)*N/r.width)),y:Math.max(0,Math.min(N,(e.clientY-r.top)*N/r.height))}}
function invalidate(){analysis=null;$('results').style.display='none';draw()}
c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);active=[pos(e)];invalidate()});c.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();const p=pos(e);if($('mode').value==='line')active=[active[0],p];else if(Math.hypot(p.x-active[active.length-1].x,p.y-active[active.length-1].y)>1)active.push(p);draw()});function finish(e){if(!active)return;e.preventDefault();const p=pos(e);if($('mode').value==='line')active=[active[0],p];else active.push(p);if(active.length>=2&&Math.hypot(active[active.length-1].x-active[0].x,active[active.length-1].y-active[0].y)>2)strokes.push(active);active=null;invalidate();$('status').textContent=`切断線 ${strokes.length}本 — 続けて描くか採点してください`}
c.addEventListener('pointerup',finish);c.addEventListener('pointercancel',()=>{active=null;draw()});$('undo').onclick=()=>{strokes.pop();invalidate();$('status').textContent=`切断線 ${strokes.length}本`};$('reset').onclick=()=>{strokes=[];invalidate();$('status').textContent='図形の端から端まで線を引いてください'};for(const id of ['shape','width'])$(id).onchange=()=>{if(id==='shape')strokes=[];invalidate()};$('target').onchange=()=>{let n=Math.round(Number($('target').value)||4);$('target').value=Math.max(2,Math.min(100,n));$('results').style.display='none'};
function calculate(){const mask=new Uint8Array(N*N),labels=new Int32Array(N*N);labels.fill(-1);let total=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;if(inside(x+.5,y+.5)){mask[i]=1;total++}}const tmp=document.createElement('canvas');tmp.width=tmp.height=N;const g=tmp.getContext('2d',{willReadFrequently:true});g.clearRect(0,0,N,N);g.strokeStyle='white';g.lineWidth=Number($('width').value)*2+1;g.lineCap='round';g.lineJoin='round';for(const s of strokes)path(g,s);const rgba=g.getImageData(0,0,N,N).data;for(let i=0;i<mask.length;i++)if(rgba[i*4+3]>80)mask[i]=0;
const queue=new Int32Array(N*N),areas=[];for(let i=0;i<mask.length;i++){if(mask[i]!==1)continue;const id=areas.length;let head=0,tail=1;queue[0]=i;mask[i]=2;labels[i]=id;while(head<tail){const v=queue[head++],x=v%N,y=(v/N)|0;const neighbors=[x>0?v-1:-1,x<N-1?v+1:-1,y>0?v-N:-1,y<N-1?v+N:-1];for(const u of neighbors)if(u>=0&&mask[u]===1){mask[u]=2;labels[u]=id;queue[tail++]=u}}areas.push(tail)}
// Tiny isolated raster artifacts are excluded from the area partition count.
const minimum=Math.max(4,Math.round(total*.0002));const keep=areas.map((a,i)=>({a,i})).filter(v=>v.a>=minimum).sort((a,b)=>b.a-a.a);const remap=new Int32Array(areas.length);remap.fill(-1);keep.forEach((v,i)=>remap[v.i]=i);for(let i=0;i<labels.length;i++)if(labels[i]>=0)labels[i]=remap[labels[i]];return{labels,areas:keep.map(v=>v.a),total}}
$('grade').onclick=()=>{try{analysis=calculate();const {areas,total}=analysis,n=Math.max(2,Math.min(100,Math.round(Number($('target').value)||4))),count=areas.length,sum=areas.reduce((a,b)=>a+b,0),ratios=areas.map(a=>a/sum),score=count===n?100*(1-ratios.reduce((s,p)=>s+Math.abs(p-1/n),0)/2):0;draw();$('results').style.display='block';$('score').textContent=score.toFixed(1)+' / 100';$('summary').textContent=`検出領域 ${count}個 / 目標 ${n}個`;const bar=$('bar'),legend=$('legend');bar.replaceChildren();legend.replaceChildren();ratios.forEach((p,i)=>{const color=palette[i%palette.length],span=document.createElement('span');span.style.width=(p*100)+'%';span.style.background=color;bar.append(span);const item=document.createElement('span');const sw=document.createElement('i');sw.className='swatch';sw.style.background=color;item.append(sw,document.createTextNode(`領域${i+1}: ${(p*100).toFixed(2)}%`));legend.append(item)});$('warning').textContent=count!==n?'目標の領域数と一致しないため、スコアは0点です。線が外周まで達しているか確認してください。':`理想面積は各領域 ${(100/n).toFixed(2)}% です。`; $('status').textContent='採点完了 — 線を追加すると再採点できます'}catch(err){$('status').textContent='採点エラー: '+err.message;console.error(err)}};draw();
})();
</script></body></html>
