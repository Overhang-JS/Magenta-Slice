<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#230c23"><title>マゼンタ・スライス</title>
<style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#e9f1fb;background:#101827}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:650px;margin:auto}h1{font-size:1.5rem;margin:4px 0}p{color:#aabbd0;font-size:.9rem;line-height:1.6}.panel{background:#192539;border:1px solid #34465f;border-radius:16px;padding:15px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:.82rem;color:#c7d5e7;display:block;margin-bottom:5px}select,input,button{width:100%;background:#263850;border:1px solid #4a6484;border-radius:10px;color:white;padding:11px;font-size:1rem}button{cursor:pointer;font-weight:650}button.primary{background:#3877c5;border-color:#5597eb}button:disabled{opacity:.4}.board-wrap{position:relative;width:100%;aspect-ratio:1;background:#101827;border-radius:12px;overflow:hidden}#static-board{position:absolute;inset:0;width:100%;height:100%;display:block}canvas{position:absolute;inset:0;width:100%;height:auto;aspect-ratio:1;display:block;background:#101827;border-radius:12px;touch-action:none}#status{font-size:.85rem;text-align:center;color:#b9c8db;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.score{font-size:2.4rem;font-weight:800;color:#8dd8b1}.muted{color:#aabbd0;font-size:.85rem}.bar{display:flex;height:19px;overflow:hidden;border-radius:6px;margin:12px 0}.bar span{min-width:0}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.84rem}.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px}#results{display:none}#warning{color:#ffd29a;font-size:.84rem;margin-top:8px}.footer{font-size:.77rem;color:#8799b2}.live-count{text-align:center;background:#203b59;border:1px solid #528bc1;border-radius:16px;padding:12px;margin:12px 0}.live-count strong{font-size:2.1rem;color:#f1f8ff}.live-count small{display:block;color:#c6d8eb;margin-top:4px}

/* Magenta Slice compact mobile theme */
:root{color:#fff1f9;background:#230c23;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
body{padding:10px 12px 18px;background:radial-gradient(ellipse at 50% 0%,#58113f 0%,#230c23 65%);min-height:100dvh}
main{max-width:600px}
h1{font-size:1.65rem;font-weight:850;letter-spacing:.025em;margin:5px 2px 9px;color:#fff3fb}
.panel{background:#38152f;border:1px solid #70335c;border-radius:15px;padding:10px;margin:8px 0}
.controls{gap:8px}
label{color:#f5c5e0;font-size:.76rem;margin-bottom:4px}
select,input,button{background:#502044;border:1px solid #96517c;border-radius:10px;color:#fff5fb;padding:9px 10px;font-size:1rem;min-height:42px}
button.primary{background:#d41d83;border-color:#f74ba5;color:white}
button:active{filter:brightness(1.13)}
.board-wrap{background:#230c23;border-radius:10px}
canvas{background:transparent}
.live-count{margin:8px 0;padding:9px 10px;background:#621344;border:1px solid #bc3c82;border-radius:14px}
.live-count strong{font-size:1.95rem;color:#fff2fa;font-variant-numeric:tabular-nums}
.live-count small{color:#f3c3df;font-size:.75rem;margin-top:2px}
#status{font-size:.75rem;margin-top:5px;color:#eebdd9;min-height:1em}
.actions{gap:7px}
.score{color:#ff75bd}
.muted{color:#f3b7d8}
#warning{color:#ffce93}
.legend{gap:6px}

/* Compact, viewport-aware layout */
html,body{min-height:100%;overscroll-behavior-y:none}
body{padding:8px 10px max(8px,env(safe-area-inset-bottom))}
main{width:100%;max-width:580px}
h1{font-size:clamp(1.15rem,4.5vw,1.5rem);line-height:1.2;margin:2px 2px 7px}
.panel{padding:7px;margin:6px 0;border-radius:12px}
.controls{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.controls>div{min-width:0}
label{font-size:.67rem;margin-bottom:3px;white-space:nowrap}
select,input,button{font-size:.83rem;padding:6px 7px;min-height:34px;border-radius:8px}
.live-count{margin:6px 0;padding:5px 8px;border-radius:11px}
.live-count strong{font-size:clamp(1.2rem,5vw,1.65rem)}
.live-count small{font-size:.68rem;margin-top:0}
.board-wrap{width:min(100%, calc(100dvh - 265px));margin:auto}
#status{font-size:.68rem;margin-top:3px;min-height:0}
.actions{gap:6px;margin-top:6px}
#results{max-height:32dvh;overflow-y:auto}
@media (max-height:700px){
 body{padding-top:5px}
 h1{margin-bottom:4px}
 .panel{margin:4px 0;padding:5px}
 .live-count{margin:4px 0;padding:4px}
 .board-wrap{width:min(100%,calc(100dvh - 230px))}
}
</style></head><body><main><h1>マゼンタ・スライス</h1><section class="panel"><div class="controls"><div><label for="shape">図形</label><select id="shape"><option value="circle">円</option><option value="half">半円</option><option value="quarter">1/4円</option></select></div><div><label for="target">目標分割数</label><input id="target" type="number" min="2" max="100" step="1" value="4" inputmode="numeric"></div><div><label for="mode">描画モード</label><select id="mode"><option value="free">自由曲線</option><option value="line">直線</option></select></div></div></section><div class="live-count" aria-live="polite"><strong id="liveCount">現在 1 / 4 分割</strong><small id="liveHint"></small></div><section class="panel"><div class="board-wrap"><svg id="static-board" viewBox="0 0 480 480" aria-label="円のプレビュー"><circle cx="240" cy="240" r="194" fill="#ffe0ef" stroke="#dd65a0" stroke-width="3"/></svg><canvas id="board" width="480" height="480" aria-label="切断線を描く領域" style="background:transparent"></canvas></div><div id="status">図形の端から端まで線を引いてください</div><noscript><p style="color:#ffd29a">JavaScriptが無効です。iPhoneの「ファイル」アプリのプレビューでは採点できません。Webサイトとして公開したURLをSafariで開いてください。</p></noscript></section><div class="actions"><button id="undo">↶ 戻す</button><button id="reset">リセット</button><button class="primary" id="grade">採点する</button></div><section class="panel" id="results"><div class="muted">均等度スコア</div><div class="score" id="score">--</div><div id="summary"></div><div class="bar" id="bar"></div><div class="legend" id="legend"></div><div id="warning"></div></section></main>
<script>
(()=>{'use strict';
const N=480,c=document.querySelector('#board'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let strokes=[],active=null,analysis=null; if(!ctx){document.getElementById('status').textContent='この表示環境ではCanvasを利用できません。SafariでHTMLを開いてください。';return;}

// Quarter circle expands to fill the board while retaining a small drawing margin.
function geometry(){return $('shape').value==='quarter'?{cx:26,cy:454,r:428}:{cx:240,cy:240,r:194}}
function inside(x,y){const {cx,cy,r}=geometry(),dx=x-cx,dy=y-cy;if(dx*dx+dy*dy>r*r)return false;const shape=$('shape').value;return shape==='circle'||(shape==='half'&&dy<=0)||(shape==='quarter'&&dx>=0&&dy<=0)}
function outline(g){g.beginPath();const shape=$('shape').value,{cx,cy,r}=geometry();if(shape==='circle')g.arc(cx,cy,r,0,Math.PI*2);else if(shape==='half'){g.arc(cx,cy,r,Math.PI,0);g.closePath()}else{g.moveTo(cx,cy);g.lineTo(cx+r,cy);g.arc(cx,cy,r,0,-Math.PI/2,true);g.closePath()}}
function path(g,points){if(points.length<2)return;g.beginPath();g.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)g.lineTo(points[i].x,points[i].y);g.stroke()}
function draw(){document.getElementById('static-board').style.display='none';ctx.clearRect(0,0,N,N);outline(ctx);ctx.fillStyle='#ffe0ef';ctx.fill();ctx.save();outline(ctx);ctx.clip();if(analysis){const data=ctx.createImageData(N,N);for(let i=0;i<analysis.labels.length;i++){const label=analysis.labels[i];if(label<0)continue;const col=accuracyColor(analysis.areas[label],analysis.areas.reduce((a,b)=>a+b,0));const j=i*4;data.data[j]=col[0];data.data[j+1]=col[1];data.data[j+2]=col[2];data.data[j+3]=255}const colorCanvas=document.createElement('canvas');colorCanvas.width=colorCanvas.height=N;const colorCtx=colorCanvas.getContext('2d');colorCtx.putImageData(data,0,0);ctx.drawImage(colorCanvas,0,0);outline(ctx);ctx.clip()}ctx.strokeStyle='#ffca46';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';for(const s of strokes)path(ctx,s);if(active)path(ctx,active);ctx.restore();outline(ctx);ctx.lineWidth=3;ctx.strokeStyle='#dd65a0';ctx.stroke()}
function targetCount(){return Math.max(2,Math.min(100,Math.round(Number($('target').value)||4)))}
function accuracyColor(area,sum){const ideal=1/targetCount(),actual=area/sum,accuracy=Math.max(0,1-Math.abs(actual-ideal)/ideal);const pale=[255,219,239],deep=[170,0,100];return pale.map((v,i)=>Math.round(v+(deep[i]-v)*accuracy))}
function rgbText(color){return 'rgb('+color.join(',')+')'}
function updateLive(){try{analysis=calculate();const count=analysis.areas.length,n=targetCount();$('liveCount').textContent='現在 '+count+' / '+n+' 分割';$('liveHint').textContent=count===n?'目標分割数に到達！':count>n?'目標より '+(count-n)+' 領域多いです':'目標まであと '+(n-count)+' 領域';draw()}catch(err){$('status').textContent='領域計算エラー: '+err.message;console.error(err)}}

function pos(e){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(N,(e.clientX-r.left)*N/r.width)),y:Math.max(0,Math.min(N,(e.clientY-r.top)*N/r.height))}}
function invalidate(){analysis=null;$('results').style.display='none';updateLive()}
c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);active=[pos(e)];$('results').style.display='none';draw()});c.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();const p=pos(e);if($('mode').value==='line')active=[active[0],p];else if(Math.hypot(p.x-active[active.length-1].x,p.y-active[active.length-1].y)>1)active.push(p);draw()});function finish(e){if(!active)return;e.preventDefault();const p=pos(e);if($('mode').value==='line')active=[active[0],p];else active.push(p);if(active.length>=2&&Math.hypot(active[active.length-1].x-active[0].x,active[active.length-1].y-active[0].y)>2)strokes.push(active);active=null;invalidate();$('status').textContent=`切断線 ${strokes.length}本 — 続けて描くか採点してください`}
c.addEventListener('pointerup',finish);c.addEventListener('pointercancel',()=>{active=null;draw()});$('undo').onclick=()=>{strokes.pop();invalidate();$('status').textContent=`切断線 ${strokes.length}本`};$('reset').onclick=()=>{strokes=[];invalidate();$('status').textContent='図形の端から端まで線を引いてください'};for(const id of ['shape'])$(id).onchange=()=>{if(id==='shape')strokes=[];invalidate()};$('target').onchange=()=>{let n=Math.round(Number($('target').value)||4);$('target').value=Math.max(2,Math.min(100,n));$('results').style.display='none';updateLive()};
function calculate(){const mask=new Uint8Array(N*N),labels=new Int32Array(N*N);labels.fill(-1);let total=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;if(inside(x+.5,y+.5)){mask[i]=1;total++}}const tmp=document.createElement('canvas');tmp.width=tmp.height=N;const g=tmp.getContext('2d',{willReadFrequently:true});g.clearRect(0,0,N,N);g.strokeStyle='white';g.lineWidth=5;g.lineCap='round';g.lineJoin='round';for(const s of strokes)path(g,s);const rgba=g.getImageData(0,0,N,N).data;for(let i=0;i<mask.length;i++)if(rgba[i*4+3]>80)mask[i]=0;
const queue=new Int32Array(N*N),areas=[];for(let i=0;i<mask.length;i++){if(mask[i]!==1)continue;const id=areas.length;let head=0,tail=1;queue[0]=i;mask[i]=2;labels[i]=id;while(head<tail){const v=queue[head++],x=v%N,y=(v/N)|0;const neighbors=[x>0?v-1:-1,x<N-1?v+1:-1,y>0?v-N:-1,y<N-1?v+N:-1];for(const u of neighbors)if(u>=0&&mask[u]===1){mask[u]=2;labels[u]=id;queue[tail++]=u}}areas.push(tail)}
// Tiny isolated raster artifacts are excluded from the area partition count.
const minimum=Math.max(4,Math.round(total*.0002));const keep=areas.map((a,i)=>({a,i})).filter(v=>v.a>=minimum).sort((a,b)=>b.a-a.a);const remap=new Int32Array(areas.length);remap.fill(-1);keep.forEach((v,i)=>remap[v.i]=i);for(let i=0;i<labels.length;i++)if(labels[i]>=0)labels[i]=remap[labels[i]];return{labels,areas:keep.map(v=>v.a),total}}
$('grade').onclick=()=>{try{analysis=calculate();const {areas,total}=analysis,n=Math.max(2,Math.min(100,Math.round(Number($('target').value)||4))),count=areas.length,sum=areas.reduce((a,b)=>a+b,0),ratios=areas.map(a=>a/sum),score=count===n?100*(1-ratios.reduce((s,p)=>s+Math.abs(p-1/n),0)/2):0;draw();$('results').style.display='block';$('score').textContent=score.toFixed(1)+' / 100';$('summary').textContent=`検出領域 ${count}個 / 目標 ${n}個`;const bar=$('bar'),legend=$('legend');bar.replaceChildren();legend.replaceChildren();ratios.forEach((p,i)=>{const color=rgbText(accuracyColor(areas[i],sum)),span=document.createElement('span');span.style.width=(p*100)+'%';span.style.background=color;bar.append(span);const item=document.createElement('span');const sw=document.createElement('i');sw.className='swatch';sw.style.background=color;item.append(sw,document.createTextNode(`領域${i+1}: ${(p*100).toFixed(2)}%`));legend.append(item)});$('warning').textContent=count!==n?'目標の領域数と一致しないため、スコアは0点です。線が外周まで達しているか確認してください。':`理想面積は各領域 ${(100/n).toFixed(2)}% です。`; $('status').textContent='採点完了 — 線を追加すると再採点できます'}catch(err){$('status').textContent='採点エラー: '+err.message;console.error(err)}};updateLive();
})();
</script></body></html>
